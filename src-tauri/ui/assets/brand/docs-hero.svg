<?xml version="1.0" encoding="UTF-8"?>
<!--
  Le visuel du README (docs/hero.png) et l'apercu social (docs/social-preview.png).
  Dessine a la main, en SVG, aux cotes reelles de l'interface : barre de 72 px,
  vignettes de 30 px, pastilles de fenetre de 15 px, deux panneaux separes de
  6 px. Un faux ecran vaut mieux qu'une capture ratee, mais il doit correspondre
  a ce que l'app dessine vraiment - sinon le README devient la liste des choses
  que l'interface ne fait pas.

  Regeneration : assets/brand/make-icons.sh (docs) ; 1600 x 900 unites, rendues a
  2560 x 1440 pour le hero et a 1280 x 640 pour l'apercu social.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="backdrop" x1="0" y1="0" x2="1600" y2="900" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0a0b12"/>
      <stop offset="0.55" stop-color="#0e1018"/>
      <stop offset="1" stop-color="#07080d"/>
    </linearGradient>
    <radialGradient id="aura" cx="380" cy="120" r="900" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7c5cff" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#7c5cff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7c5cff"/>
      <stop offset="1" stop-color="#3a3f9f"/>
    </linearGradient>
    <linearGradient id="pane" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#181b26"/>
      <stop offset="1" stop-color="#131520"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="26" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
    <clipPath id="win"><rect x="120" y="80" width="1360" height="740" rx="14"/></clipPath>
  </defs>

  <rect width="1600" height="900" fill="url(#backdrop)"/>
  <rect width="1600" height="900" fill="url(#aura)"/>

  <g filter="url(#shadow)">
    <rect x="120" y="80" width="1360" height="740" rx="14" fill="#14161f"/>
  </g>

  <g clip-path="url(#win)">
    <!-- barre de titre : les trois pastilles a gauche, a la mac, avec la
         sémantique de Windows -->
    <rect x="120" y="80" width="1360" height="40" fill="#1b1e2a"/>
    <circle cx="140" cy="100" r="7.5" fill="#ef6a62"/>
    <circle cx="165" cy="100" r="7.5" fill="#f5bd4f"/>
    <circle cx="190" cy="100" r="7.5" fill="#5bc664"/>
    <text x="222" y="105" font-family="'DejaVu Sans', sans-serif" font-size="13" font-weight="bold" fill="#e6e9f2">Soocial</text>
    <text x="278" y="105" font-family="'DejaVu Sans', sans-serif" font-size="12" fill="#7d849c">Messages d'equipe</text>
    <rect x="120" y="119.5" width="1360" height="1" fill="#ffffff" fill-opacity="0.06"/>

    <!-- barre laterale : 72 units, l'entree du menu en haut, cinq vignettes -->
    <rect x="120" y="120" width="72" height="700" fill="#1a1d28"/>
    <rect x="120" y="120" width="1" height="700" fill="#ffffff" fill-opacity="0.06"/>
    <g transform="translate(141 144)">
      <rect width="30" height="30" rx="9" fill="url(#tile)"/>
      <g fill="#ffffff">
        <rect x="20" y="6.5" width="8" height="6" rx="2.6" fill-opacity="0.34"/>
        <rect x="5" y="10.5" width="17.5" height="12" rx="4.6"/>
        <path d="M9.5 22l-2.9 4.9q-.4.8.4.5l5.3-1.5z"/>
      </g>
      <g fill="#3a3f9f">
        <circle cx="10.1" cy="16.6" r="1.35"/>
        <circle cx="13.7" cy="16.6" r="1.35"/>
        <circle cx="17.3" cy="16.6" r="1.35"/>
      </g>
    </g>
    <rect x="128" y="186" width="56" height="1" fill="#ffffff" fill-opacity="0.06"/>

    <!-- vignettes de services : 30 units, pastille de non-lus en haut a droite -->
    <g font-family="'DejaVu Sans', sans-serif" font-size="9" font-weight="bold" fill="#ffffff">
      <g transform="translate(141 200)">
        <circle cx="15" cy="15" r="15" fill="#2aabee"/>
        <path d="M21.6 10.2 8.9 15.4c-.8.3-.8 1.4.1 1.6l3.2.8 1.2 3.7c.2.7 1 .8 1.5.3l1.7-1.6 3.4 2.5c.7.4 1.4.1 1.5-.8l2.1-9.9c.2-.9-.6-1.3-1.9-.9z" fill="#ffffff" fill-opacity="0.95"/>
        <rect x="21" y="-1" width="15" height="12" rx="6" fill="#ef6a62"/>
        <text x="28.5" y="8" text-anchor="middle" font-size="8">3</text>
      </g>
      <g transform="translate(141 240)">
        <circle cx="15" cy="15" r="15" fill="#0b6ead"/>
        <path d="M15 7.5c-4.1 0-7.5 3.4-7.5 7.5s3.4 7.5 7.5 7.5 7.5-3.4 7.5-7.5" stroke="#ffffff" stroke-width="2.2" fill="none" stroke-linecap="round"/>
        <path d="M11 15a4 4 0 0 1 8 0" stroke="#ffffff" stroke-width="2.2" fill="none"/>
      </g>
      <g transform="translate(141 280)">
        <circle cx="15" cy="15" r="15" fill="#5865f2"/>
        <rect x="8" y="10" width="14" height="10" rx="5" fill="#ffffff" fill-opacity="0.95"/>
        <circle cx="12.6" cy="15" r="1.5" fill="#5865f2"/>
        <circle cx="17.4" cy="15" r="1.5" fill="#5865f2"/>
        <rect x="21" y="-1" width="15" height="12" rx="6" fill="#ef6a62"/>
        <text x="28.5" y="8" text-anchor="middle" font-size="8">12</text>
      </g>
      <g transform="translate(141 320)">
        <circle cx="15" cy="15" r="15" fill="#45475a"/>
        <text x="15" y="19" text-anchor="middle" font-size="11">G</text>
      </g>
      <g transform="translate(141 360)">
        <circle cx="15" cy="15" r="15" fill="#00a884"/>
        <path d="M11 11c0-1 .8-1.8 1.8-1.8h1c.5 0 1 .3 1.2.8l.8 2c.2.5 0 1-.4 1.3l-.9.7c.9 1.8 2.4 3.3 4.2 4.2l.7-.9c.3-.4.8-.6 1.3-.4l2 .8c.5.2.8.7.8 1.2v1c0 1-.8 1.8-1.8 1.8C12.9 22.5 11 17.6 11 11z" fill="#ffffff" fill-opacity="0.95"/>
      </g>
    </g>

    <!-- commandes du bas de la barre -->
    <g transform="translate(141 702)" fill="none" stroke="#8b93ad" stroke-width="1.8" stroke-linecap="round">
      <path d="M24.4 12.3A10 10 0 0 1 11.8 4.2 10 10 0 1 0 24.4 12.3z"/>
    </g>
    <g transform="translate(141 738)" stroke="#8b93ad" stroke-width="1.8" stroke-linecap="round" fill="none">
      <path d="M4 26v-7M4 11V4M15 26v-11M15 9V4M26 26v-5M26 12V4"/>
    </g>
    <g transform="translate(141 774)" stroke="#8b93ad" stroke-width="1.8" stroke-linecap="round" fill="none">
      <rect x="2" y="2" width="26" height="26" rx="9" stroke-dasharray="4 4"/>
      <path d="M15 9v12M9 15h12"/>
    </g>

    <!-- panneau gauche : conversation -->
    <rect x="198" y="126" width="620" height="688" rx="10" fill="url(#pane)"/>
    <rect x="198" y="126" width="620" height="46" rx="10" fill="#1e2230"/>
    <circle cx="226" cy="149" r="13" fill="#5865f2"/>
    <text x="248" y="146" font-family="'DejaVu Sans', sans-serif" font-size="12.5" font-weight="bold" fill="#eef0f7">Sales Team</text>
    <text x="248" y="161" font-family="'DejaVu Sans', sans-serif" font-size="10.5" fill="#8b93ad">Julie, Marco, Alex</text>
    <rect x="198" y="171.5" width="620" height="1" fill="#ffffff" fill-opacity="0.05"/>

    <g font-family="'DejaVu Sans', sans-serif" font-size="11.5">
      <g>
        <rect x="222" y="200" width="264" height="46" rx="10" fill="#242938"/>
        <text x="238" y="219" fill="#a9b3cf" font-size="10.5">Julie</text>
        <text x="238" y="236" fill="#e8ebf2">Bonjour ! La facture est partie ?</text>
      </g>
      <g>
        <rect x="428" y="262" width="190" height="40" rx="10" fill="#2f6b57"/>
        <text x="444" y="279" fill="#c8ead9" font-size="10.5">Toi</text>
        <text x="444" y="295" fill="#f2fbf6">Envoyee a 9 h 04</text>
      </g>
      <g>
        <rect x="222" y="318" width="300" height="46" rx="10" fill="#242938"/>
        <text x="238" y="337" fill="#a9b3cf" font-size="10.5">Marco</text>
        <text x="238" y="354" fill="#e8ebf2">Le client signe jeudi, il faut la grille</text>
      </g>
      <g>
        <rect x="398" y="380" width="220" height="40" rx="10" fill="#2f6b57"/>
        <text x="414" y="397" fill="#c8ead9" font-size="10.5">Toi</text>
        <text x="414" y="413" fill="#f2fbf6">Je la mets a jour la</text>
      </g>
    </g>

    <rect x="222" y="742" width="576" height="42" rx="12" fill="#20242f"/>
    <text x="242" y="768" font-family="'DejaVu Sans', sans-serif" font-size="12" fill="#6f7791">Ecrire un message...</text>
    <circle cx="768" cy="763" r="9" fill="none" stroke="#6f7791" stroke-width="1.6"/>
    <path d="M768 758v6l4 3" stroke="#6f7791" stroke-width="1.6" fill="none" stroke-linecap="round"/>

    <!-- panneau droit : agenda, separe de 6 units -->
    <rect x="824" y="126" width="620" height="688" rx="10" fill="url(#pane)"/>
    <rect x="824" y="126" width="620" height="46" rx="10" fill="#1e2230"/>
    <text x="848" y="155" font-family="'DejaVu Sans', sans-serif" font-size="13" font-weight="bold" fill="#eef0f7">Aout 2026</text>
    <rect x="1330" y="138" width="94" height="24" rx="12" fill="#2a2f3d"/>
    <text x="1377" y="154" text-anchor="middle" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="#a9b3cf">Aujourd'hui</text>
    <rect x="824" y="171.5" width="620" height="1" fill="#ffffff" fill-opacity="0.05"/>

    <g font-family="'DejaVu Sans', sans-serif" font-size="10" fill="#7d849c">
      <text x="902" y="196" text-anchor="middle">LUN</text>
      <text x="1056" y="196" text-anchor="middle">MAR</text>
      <text x="1210" y="196" text-anchor="middle">MER</text>
      <text x="1364" y="196" text-anchor="middle">JEU</text>
    </g>
    <g stroke="#ffffff" stroke-opacity="0.05">
      <path d="M979 208v590M1133 208v590M1287 208v590"/>
      <path d="M840 236h588M840 296h588M840 356h588M840 416h588M840 476h588M840 536h588M840 596h588M840 656h588M840 716h588"/>
    </g>
    <g font-family="'DejaVu Sans', sans-serif" font-size="11" fill="#a9b3cf">
      <text x="848" y="230">10</text>
      <text x="1156" y="230">12</text>
      <text x="1310" y="230">13</text>
    </g>
    <circle cx="1012" cy="226" r="11" fill="#7c5cff" fill-opacity="0.22"/>
    <text x="1008" y="230" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="#dcd4ff">11</text>

    <g font-family="'DejaVu Sans', sans-serif" font-size="10.5">
      <rect x="845" y="242" width="120" height="30" rx="7" fill="#2f8f5b"/>
      <text x="857" y="261" fill="#eafaf0">Debrief</text>
      <rect x="995" y="242" width="128" height="44" rx="7" fill="#ef6a62"/>
      <text x="1007" y="261" fill="#fff1f0">Livraison Soocial 1.0</text>
      <text x="1007" y="276" fill="#ffd9d6" font-size="9">10:00 - 11:00</text>
      <rect x="1149" y="302" width="120" height="30" rx="7" fill="#5865f2"/>
      <text x="1161" y="321" fill="#eef0ff">Point produit</text>
      <rect x="1303" y="362" width="120" height="44" rx="7" fill="#f5bd4f"/>
      <text x="1315" y="381" fill="#2a2205">Revue tarifs</text>
      <text x="1315" y="396" fill="#4a3d10" font-size="9">14:00 - 15:00</text>
      <rect x="995" y="482" width="120" height="30" rx="7" fill="#2f8f5b"/>
      <text x="1007" y="501" fill="#eafaf0">Client : signature</text>
    </g>
  </g>

  <rect x="120" y="80" width="1360" height="740" rx="14" fill="none" stroke="#ffffff" stroke-opacity="0.09"/>
</svg>
