<?xml version="1.0" encoding="UTF-8"?>
<!--
  Art de la barre laterale de l'installeur (164 x 314, taille_exacte : aucune
  recompression entre ce fichier et le BMP). Le texte est volonte en francais :
  ces bitmaps ne sont pas localises par NSIS, ils donnent le ton de la marque,
  pas une consigne.

  L'apparence de l'installeur etait un element de la marque a conserver : la
  vignette en haut, le nom, la ligne de niveau, la grande forme fantome en bas a
  droite, le pied de page en petites capitales.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="164" height="314" viewBox="0 0 164 314">
  <title>Soocial - barre laterale de l'installeur</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="314" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#191c28"/>
      <stop offset="0.55" stop-color="#11131c"/>
      <stop offset="1" stop-color="#0b0c12"/>
    </linearGradient>
    <radialGradient id="glow" cx="34" cy="46" r="150" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7c5cff" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#7c5cff" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="card"><rect width="164" height="314"/></clipPath>
  </defs>

  <g clip-path="url(#card)">
    <rect width="164" height="314" fill="url(#bg)"/>
    <rect width="164" height="314" fill="url(#glow)"/>

    <!-- Les deux formes fantomes, signature de la marque : la vignette et la bulle,
         tournees, a peine plus claires que le fond. -->
    <g fill="#ffffff" fill-opacity="0.035">
      <rect x="92" y="196" width="120" height="120" rx="30" transform="rotate(-16 152 256)"/>
      <rect x="150" y="150" width="96" height="96" rx="26" transform="rotate(14 198 198)"/>
    </g>

    <!-- La vignette, posee sur son carre de marque. -->
    <rect x="20" y="26" width="64" height="64" rx="17" fill="#4b3fa8"/>
    <svg x="26" y="32" width="52" height="52" viewBox="60 60 392 392">
      <g fill="#ffffff">
        <rect x="232" y="92" width="176" height="124" rx="52" fill-opacity="0.34"/>
        <rect x="84" y="176" width="288" height="196" rx="72"/>
        <path d="M158 352l-46 78q-7 13 7 9l86-24z"/>
      </g>
      <g fill="#4b3fa8">
        <circle cx="158" cy="274" r="20"/>
        <circle cx="228" cy="274" r="20"/>
        <circle cx="298" cy="274" r="20"/>
      </g>
    </svg>

    <text x="20" y="124" font-family="Archivo, 'Segoe UI', 'DejaVu Sans', sans-serif" font-size="26" font-weight="700" letter-spacing="-1" fill="#e9ecf5">Soocial</text>
    <text x="20" y="146" font-family="'Segoe UI', 'DejaVu Sans', sans-serif" font-size="10.5" fill="#a9b0c6">Tous tes comptes.</text>
    <text x="20" y="160" font-family="'Segoe UI', 'DejaVu Sans', sans-serif" font-size="10.5" fill="#a9b0c6">Une seule fenêtre.</text>

    <text x="20" y="296" font-family="'Segoe UI', 'DejaVu Sans', sans-serif" font-size="7" letter-spacing="1.4" fill="#767e95">SESSIONS ISOLÉES</text>
  </g>
</svg>
